# Conda environment for readers who prefer conda over Poetry/venv+pip.
# Poetry (`poetry install`, see ../README.md) is the primary, authoritative
# setup path used to produce this project's reported results; this file is
# a convenience alternative for conda users. Package versions are inlined
# (not `-r requirements.txt`) to avoid relative-path ambiguity depending on
# where `conda env create` is invoked from -- kept in sync with
# requirements.txt/poetry.lock by hand.
#
# Usage:
#   conda env create -f reproducibility/environment.yml
#   conda activate agente-5g

name: agente-5g
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - scapy==2.7.0
      - pydantic==2.13.4
      - pydantic-settings==2.14.2
      - pandas==2.3.3
      - pyarrow==18.1.0
      - numpy==1.26.4
      - scikit-learn==1.9.0
      - xgboost==2.1.4
      - plotly==6.9.0
      - pyyaml==6.0.3
      - requests==2.34.2
      - typer==0.27.0
      - tqdm==4.70.0
      - psutil==6.1.1
      - kaleido==1.3.0
      - pytest==8.4.2
      - pytest-cov==6.3.0
      - ruff==0.8.6
      - black==24.10.0
      - mypy==1.20.2
      - types-pyyaml==6.0.12.20260724
