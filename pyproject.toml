[project]
name = "agente-5g"
version = "0.1.0"
description = "Agentic Intrusion Detection System for the 5G User Plane (GTP-U/TEID/PDU-session reasoning) vs. classical ML on the 5G-NIDD dataset."
authors = [{ name = "Justo Hernandez", email = "justo.hernandez@edu.upct.es" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "scapy (>=2.6.1,<3.0.0)",
  "pydantic (>=2.9,<3.0)",
  "pydantic-settings (>=2.6,<3.0)",
  "pandas (>=2.2,<3.0)",
  "pyarrow (>=17.0,<19.0)",
  "numpy (>=1.26,<2.0)",
  "scikit-learn (>=1.5,<2.0)",
  "xgboost (>=2.1,<3.0)",
  "plotly (>=5.24,<6.0)",
  "pyyaml (>=6.0,<7.0)",
  "requests (>=2.32,<3.0)",
  "typer (>=0.13,<1.0)",
  "tqdm (>=4.67,<5.0)",
  "psutil (>=6.1,<7.0)",
]

[project.optional-dependencies]
pyshark = ["pyshark (>=0.6,<0.7)"]

[tool.poetry]
packages = [{ include = "agente_5g", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
black = "^24.10"
mypy = "^1.13"
ipykernel = "^6.29"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-m 'not integration' --cov=agente_5g --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: touches real pcap data, excluded from the default fast run",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
