# Rule thresholds for the detection agents (src/agente_5g/agents/*).
# Kept separate from code so they are independently auditable/citable in the
# thesis, and physically separate from configs/label_patterns.yaml (Level-3
# label validation) to avoid label/detection circularity -- different file,
# different constants, different code path (agents/rules.py vs.
# preprocessing/labeling.py).
#
# Initial values are order-of-magnitude domain defaults, informed by the
# real-data calibration in scripts/validate_labeling.py (e.g. real
# ICMPflood traffic runs at ~1 pkt/s sustained, not a linespeed flood) but
# not yet independently tuned against a held-out set -- see
# experiment_plan.md for the planned tuning pass.

teid_agent:
  # Sustained, uniform-size traffic concentrated on very few destination
  # ports -- catches ICMP/UDP/SYN floods generically (packet rate, not
  # protocol, is the signal; protocol-specific rules below add precision
  # for TCP-based floods).
  flood:
    min_packets_per_s: 0.8
    max_teid_entropy: 1.5
    max_unique_dst_ports: 3
  syn_flood:
    min_syn_count: 20
    max_ack_to_syn_ratio: 0.1
  scan:
    min_unique_dst_ports: 15
    max_packets_per_dst_port: 3.0

pdu_session_agent:
  state_machine:
    # risk_score bands mapping to session states; a session's *target*
    # state for a given observation is the highest band its risk_score
    # reaches, but actual transitions are rate-limited (see
    # pdu_session_agent.py) to at most one level per observed window.
    normal_max: 0.25
    watch_max: 0.5
    suspicious_max: 0.75
    # >= suspicious_max -> ATTACK
  # Phase 5B calibration (scripts/calibrate_agent_thresholds.py,
  # outputs/reports/agent_threshold_calibration/report.md), pooled across
  # all 9 real BS1 attack types, HIGH-confidence-benign vs. HIGH/MEDIUM-
  # confidence-attack: state_transition_rate separates cleanly (benign
  # p99=11.47 vs. attack median=106.8), so 15.0 sits comfortably above the
  # benign p99 with a wide margin below the attack distribution.
  high_state_transition_rate: 15.0
  # NEUTRALIZED, not recalibrated: the real data shows attack traffic has
  # HIGHER temporal entropy than benign (attack median=2.69 vs. benign
  # median=0.50) -- the exact opposite of this rule's "low entropy =
  # bursty/suspicious" assumption. No threshold VALUE can fix a reversed
  # relationship without flipping the rule's `<=` comparison to `>=`, which
  # is a logic change, not a calibration change, and is out of scope for
  # Phase 5B. Set below the valid range of Shannon entropy (>= 0) so the
  # rule mathematically can never trigger, removing its false-positive
  # contribution without altering agents/rules.py. The inverted
  # relationship itself is a real finding -- see experiment_plan.md -- left
  # for future investigation, not treated as solved.
  low_temporal_entropy: -1.0
  high_diversity: 15

supervisor_agent:
  fusion_weights:
    teid_agent: 0.6
    pdu_session_agent: 0.4
  attack_decision_threshold: 0.5
